name: Compilar shader (.mcpack)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plataforma"
        default: "android"
        type: choice
        options:
          - android
          - multiplatform
      version:
        description: "Numero de version del pack (ej: 1)"
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (lazurite v0.9.0, rich)
        run: python -m pip install -r requirements.txt

      - name: Preparar entorno (descarga shaderc y materiales)
        run: |
          chmod +x build.sh
          ./build.sh setup

      - name: Compilar el pack
        run: ./build.sh pack -p ${{ inputs.platform }} -v ${{ inputs.version }}

      - name: Buscar el .mcpack generado
        run: ls -la build/

      - name: Publicar como Release (descarga directa del .mcpack)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shader build ${{ github.run_number }}
          files: build/*.mcpack
